openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: LINE WORKS 欠席・遅刻連絡アプリ
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: reports
    description: 欠席・遅刻連絡
  - name: lineworks
    description: LINE WORKS連携
  - name: settings
    description: アプリ設定
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /reports:
    get:
      operationId: listReports
      tags: [reports]
      summary: 連絡履歴一覧を取得
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: 連絡履歴一覧
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Report"
    post:
      operationId: createReport
      tags: [reports]
      summary: 欠席・遅刻連絡を送信
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportInput"
      responses:
        "201":
          description: 送信成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Report"
        "400":
          description: 入力エラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: LINE WORKS送信エラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /reports/{id}:
    delete:
      operationId: deleteReport
      tags: [reports]
      summary: 連絡を取り消し（削除）
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: 削除成功
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    get:
      operationId: getReport
      tags: [reports]
      summary: 連絡詳細を取得
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: 連絡詳細
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Report"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /reports/summary:
    get:
      operationId: getReportSummary
      tags: [reports]
      summary: 連絡サマリー統計を取得
      responses:
        "200":
          description: サマリー統計
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportSummary"

  /settings:
    get:
      operationId: getSettings
      tags: [settings]
      summary: 設定を取得
      responses:
        "200":
          description: 設定
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppSettings"
    patch:
      operationId: updateSettings
      tags: [settings]
      summary: 設定を更新
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppSettingsInput"
      responses:
        "200":
          description: 更新後の設定
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppSettings"

  /lineworks/digest:
    post:
      operationId: sendDigest
      tags: [lineworks]
      summary: 本日の未送信連絡をまとめてLINE WORKSへ送信
      responses:
        "200":
          description: 送信成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DigestResult"
        "400":
          description: 送信する連絡がない
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: LINE WORKS APIエラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /lineworks/channels:
    get:
      operationId: listChannels
      tags: [lineworks]
      summary: LINE WORKSチャンネル一覧を取得
      responses:
        "200":
          description: チャンネル一覧
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Channel"
        "502":
          description: LINE WORKS APIエラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Report:
      type: object
      required:
        - id
        - type
        - senderName
        - reason
        - date
        - status
        - createdAt
      properties:
        id:
          type: integer
        type:
          type: string
          enum: [absence, late, earlyLeave, other]
        senderName:
          type: string
        reason:
          type: string
        date:
          type: string
          description: 欠席・遅刻の日付 (YYYY-MM-DD)
        expectedTime:
          type: ["string", "null"]
          description: 遅刻の場合の到着予定時刻
        channelId:
          type: ["string", "null"]
        status:
          type: string
          enum: [sent, failed, pending]
        lineWorksMessageId:
          type: ["string", "null"]
        createdAt:
          type: string

    ReportInput:
      type: object
      required:
        - type
        - senderName
        - reason
        - date
      properties:
        type:
          type: string
          enum: [absence, late, earlyLeave, other]
        senderName:
          type: string
          minLength: 1
        reason:
          type: string
          minLength: 1
        date:
          type: string
          description: 欠席・遅刻の日付 (YYYY-MM-DD)
        expectedTime:
          type: string
          description: 遅刻の場合の到着予定時刻
        channelId:
          type: string
          description: 送信先チャンネルID（省略時はデフォルト）

    ReportSummary:
      type: object
      required:
        - total
        - absenceCount
        - lateCount
        - earlyLeaveCount
        - otherCount
        - recentReports
      properties:
        total:
          type: integer
        absenceCount:
          type: integer
        lateCount:
          type: integer
        earlyLeaveCount:
          type: integer
        otherCount:
          type: integer
        recentReports:
          type: array
          items:
            $ref: "#/components/schemas/Report"

    Channel:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: ["string", "null"]

    WeekdayTimes:
      type: object
      description: "曜日ごとの自動送信時間 { \"0\": \"08:45\", \"1\": \"15:15\", ... }"
      additionalProperties:
        type: string
        pattern: "^([01]?[0-9]|2[0-3]):([0-5][0-9])$"
      example:
        "0": "08:45"
        "1": "15:15"
        "6": "08:45"

    AppSettings:
      type: object
      required:
        - weeklyDigestDay
        - weekdayTimes
      properties:
        weeklyDigestDay:
          type: integer
          minimum: 0
          maximum: 6
          description: "週次ダイジェストを送信する曜日 (0=日, 1=月, ... 6=土) — 過去互換用"
        weekdayTimes:
          $ref: "#/components/schemas/WeekdayTimes"

    AppSettingsInput:
      type: object
      properties:
        weeklyDigestDay:
          type: integer
          minimum: 0
          maximum: 6
        weekdayTimes:
          $ref: "#/components/schemas/WeekdayTimes"

    DigestResult:
      type: object
      required:
        - sentCount
        - date
      properties:
        sentCount:
          type: integer
          description: 送信した連絡件数
        date:
          type: string
          description: 対象日付 (YYYY-MM-DD)
        messageId:
          type: ["string", "null"]

    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
